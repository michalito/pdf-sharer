name: saita

services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "${HOST_PORT:-5001}:5000"
    volumes:
      - .:/app
      - saita_data:/app/instance
      - saita_uploads:/app/uploads
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-dev-only-not-for-production}
      - DATABASE_URL=${DATABASE_URL:-}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-2147483648}
      - MAX_NOTE_TEXT_LENGTH=${MAX_NOTE_TEXT_LENGTH:-100000}
      - NOTE_EXCERPT_LENGTH=${NOTE_EXCERPT_LENGTH:-180}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-0}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - APP_VERSION=${APP_VERSION:-dev}
    command: flask run --host=0.0.0.0 --port=5000 --reload
    restart: unless-stopped

  frontend:
    image: node:20-bookworm-slim
    working_dir: /frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://web:5000
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - web

volumes:
  saita_data:
  saita_uploads:
  frontend_node_modules:
