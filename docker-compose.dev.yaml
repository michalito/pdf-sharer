services:
  web:
    build: .
    ports:
      - "${HOST_PORT:-5001}:5000"
    volumes:
      - .:/app
      - pdf_data:/app/instance
      - pdf_uploads:/app/uploads
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-dev-only-not-for-production}
      - DATABASE_URL=${DATABASE_URL:-}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-67108864}
    command: flask run --host=0.0.0.0 --port=5000 --reload
    restart: unless-stopped

volumes:
  pdf_data:
  pdf_uploads:
