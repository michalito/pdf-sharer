<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ error_code }} - PDF Sharer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--color-primary);
            margin: 0;
            line-height: 1;
        }

        .error-message {
            font-size: 1.25rem;
            color: var(--color-text-muted);
            margin: 1rem 0 2rem;
            max-width: 400px;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header__title">PDF Sharer</h1>
    </header>

    <main class="error-page">
        <h1 class="error-code">{{ error_code }}</h1>
        <p class="error-message">{{ error_message }}</p>
        <div class="error-actions">
            <a href="{{ url_for('web.index') }}" class="btn btn--primary">Go Home</a>
        </div>
    </main>
</body>
</html>
