<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to PDF Sharer">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Login - PDF Sharer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .auth-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--color-surface);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            padding: 2rem;
        }

        .auth-card__title {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text-muted);
        }

        .form-group input {
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--color-bg);
            color: var(--color-text);
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .auth-form .btn {
            margin-top: 0.5rem;
            padding: 0.875rem;
            width: 100%;
            justify-content: center;
        }

        .auth-error {
            background: var(--color-error-bg, #fef2f2);
            color: var(--color-error, #dc2626);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
            margin-bottom: 1rem;
        }

        .auth-error.visible {
            display: block;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header__title">PDF Sharer</h1>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <h2 class="auth-card__title">Login</h2>

            <div id="auth-error" class="auth-error"></div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn--primary">Login</button>
            </form>
        </div>
    </main>

    <script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
