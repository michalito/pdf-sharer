<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Password required to open shared item">
    <title>Protected item - saíta</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --panel: #ffffff;
            --panel-border: #d8deea;
            --text: #152033;
            --muted: #5f6b80;
            --accent: #0d6efd;
            --accent-strong: #0a58ca;
            --danger-bg: #fee2e2;
            --danger-border: #fecaca;
            --danger-text: #991b1b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(1200px 600px at 0% 0%, rgba(13, 110, 253, 0.14), transparent 62%),
                radial-gradient(900px 500px at 100% 100%, rgba(15, 23, 42, 0.08), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            padding: 1rem;
        }

        main {
            width: min(460px, 100%);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            background: var(--panel);
            box-shadow: 0 16px 42px rgba(15, 23, 42, 0.12);
            padding: 1.25rem;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
        }

        p {
            margin: 0.55rem 0 0;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .meta {
            margin-top: 0.75rem;
            font-size: 0.78rem;
            color: var(--muted);
            font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        form {
            margin-top: 1rem;
            display: grid;
            gap: 0.75rem;
        }

        label {
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        input[type="password"] {
            width: 100%;
            border: 1px solid var(--panel-border);
            background: #f8fafc;
            border-radius: 10px;
            padding: 0.62rem 0.72rem;
            color: var(--text);
            outline: none;
            margin-top: 0.35rem;
            font-size: 0.95rem;
        }

        input[type="password"]:focus-visible {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.16);
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 0.66rem 0.82rem;
            font-size: 0.93rem;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: var(--accent);
            transition: background 120ms ease-in-out;
        }

        button:hover {
            background: var(--accent-strong);
        }

        .error {
            margin-top: 0.25rem;
            border: 1px solid var(--danger-border);
            background: var(--danger-bg);
            color: var(--danger-text);
            border-radius: 10px;
            padding: 0.62rem 0.72rem;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Password required</h1>
        <p>This shared {{ item_kind }} is protected. Enter the password to continue.</p>
        <div class="meta">Item #{{ item_id }} - {{ item_name }}</div>

        {% if error_message %}
            <div class="error">{{ error_message }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('web.unlock_public_item', item_id=item_id) }}">
            <label>
                Password
                <input
                    type="password"
                    name="password"
                    required
                    minlength="8"
                    maxlength="128"
                    autofocus
                    autocomplete="current-password"
                >
            </label>
            <button type="submit">Unlock item</button>
        </form>
    </main>
</body>
</html>
