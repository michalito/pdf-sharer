<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shared note from saita">
    <title>{{ note_title }} - saita</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7f9;
            --text: #1f2937;
            --panel-bg: #ffffff;
            --panel-border: #d9dee8;
            --panel-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
            --muted: #6b7280;
            --rule: #e5e7eb;
        }
        body {
            margin: 0;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        main {
            max-width: 760px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        article {
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            background: var(--panel-bg);
            padding: 1.25rem;
            box-shadow: var(--panel-shadow);
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.3;
        }
        .meta {
            margin-top: 0.5rem;
            color: var(--muted);
            font-size: 0.85rem;
        }
        pre {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--rule);
            white-space: pre-wrap;
            word-break: break-word;
            font: 0.95rem/1.5 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1019;
                --text: #e5e7eb;
                --panel-bg: #111827;
                --panel-border: #374151;
                --panel-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
                --muted: #9ca3af;
                --rule: #334155;
            }
        }
    </style>
</head>
<body>
    <main>
        <article>
            <h1>{{ note_title }}</h1>
            <div class="meta">Shared note #{{ item_id }} - {{ created_at.strftime("%Y-%m-%d %H:%M UTC") }}</div>
            <pre>{{ note_text }}</pre>
        </article>
    </main>
</body>
</html>
