name: saita

services:
  web:
    build:
      context: .
      target: prod
    ports:
      - "${HOST_PORT:-5001}:5000"
    volumes:
      - saita_data:/app/instance
      - saita_uploads:/app/uploads
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL:-}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-2147483648}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  saita_data:
  saita_uploads:
